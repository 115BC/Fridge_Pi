[program:fridge-server]
command=/opt/fridge-venv/bin/python /app/server/run_nas.py
directory=/app/server
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stdout_logfile=/app/logs/server.log
stderr_logfile=/app/logs/server.err.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3

[program:fridge-nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
stdout_logfile=/app/logs/nginx.log
stderr_logfile=/app/logs/nginx.err.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
