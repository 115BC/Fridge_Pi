<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>宿舍冰箱 · 触控屏</title>
<style>
  * { box-sizing: border-box; margin: 0; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
  body { background: #f4f6f8; padding: 16px; }
  h1 { font-size: 22px; margin-bottom: 12px; }
  .card { background: #fff; border-radius: 12px; padding: 16px; margin-bottom: 12px;
          box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  button { border: none; border-radius: 10px; font-size: 18px; padding: 14px 20px;
           cursor: pointer; }
  .big { width: 100%; }
  .blue { background: #1677ff; color: #fff; }
  .green { background: #22a06b; color: #fff; }
  .grey { background: #eef1f5; color: #333; }
  .topbar { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; }
  .topbar .sp { flex: 1; }
  .topbar button { font-size: 15px; padding: 8px 14px; }
  #live { width: 100%; max-height: 320px; object-fit: contain; border-radius: 8px;
          background: #111; display: none; }
  #photo { width: 100%; max-height: 320px; object-fit: contain; border-radius: 8px;
           background: #eee; display: none; margin-top: 8px; }
  .codes { color: #555; font-size: 14px; margin-top: 6px; }
  .guess { font-size: 16px; margin: 10px 0; }
  .guess b { color: #1677ff; }
  #name, #takeCode, #expire { width: 100%; font-size: 18px; padding: 12px; border: 1px solid #ddd;
               border-radius: 10px; margin-bottom: 10px; }
  .cats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
  .cats button { background: #eef1f5; color: #333; font-size: 16px; padding: 12px 4px; }
  .cats button.sel { background: #1677ff; color: #fff; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
  .chips button { background: #fff7e6; border: 1px solid #ffd591; color: #874d00;
                  font-size: 16px; padding: 8px 14px; border-radius: 999px; }
  .msg { text-align: center; font-size: 16px; margin-top: 8px; min-height: 24px; }
  .hidden { display: none !important; }

  /* 待机屏 */
  #scr-standby { height: 92vh; display: flex; flex-direction: column; align-items: center;
                 justify-content: center; background: #101820; color: #fff; border-radius: 16px; }
  #clock { font-size: 84px; font-weight: 300; letter-spacing: 4px; }
  #dateStr { font-size: 22px; color: #9fb3c8; margin-top: 6px; }
  #standbyHint { font-size: 20px; margin-top: 48px; color: #cdd9e5; }
  /* 选择屏 */
  #scr-home .pick { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 20px; }
  #scr-home .pick button { font-size: 30px; padding: 64px 0; }
  #scr-home .sub { color: #666; font-size: 15px; margin-top: 20px; text-align: center; }
  .volhint { font-size: 14px; color: #888; margin: -4px 0 10px; }
</style>
</head>
<body>

<!-- 待机屏 -->
<div id="scr-standby">
  <div id="clock">--:--</div>
  <div id="dateStr"></div>
  <div id="standbyHint">轻触屏幕开始使用</div>
</div>

<!-- 存入 / 取出 选择屏 -->
<div id="scr-home" class="hidden">
  <h1>宿舍冰箱智能管理</h1>
  <div class="card pick">
    <button class="blue" onclick="enterStore()">存入物品</button>
    <button class="green" onclick="enterTake()">取出物品</button>
  </div>
  <div class="sub">存入：先扫屏幕登录码，拍照登记后自动打印标签并开锁；取出：扫标签码 / 登录后点我的物品 / 小程序一键开锁</div>
</div>

<!-- 扫码登录屏（存入前） -->
<div id="scr-login" class="hidden">
  <div class="topbar">
    <button class="grey" onclick="goHome()">← 返回</button>
    <div class="sp"></div><h1 style="margin:0">扫码登录</h1><div class="sp"></div>
    <div style="width:74px"></div>
  </div>
  <div class="card" style="text-align:center">
    <div class="guess">打开<b style="color:#1677ff">微信小程序</b> → 我的页「扫屏幕登录码」对准下方二维码</div>
    <img id="loginQr" style="width:300px;height:300px;background:#fff" alt="登录二维码">
    <div class="msg" id="loginMsg">等待扫码确认…</div>
    <button class="big grey" onclick="startLogin()">看不清？刷新登录码</button>
  </div>
</div>

<!-- 存入屏 -->
<div id="scr-store" class="hidden">
  <div class="topbar">
    <button class="grey" onclick="goHome()">← 返回</button>
    <div class="sp"></div><h1 style="margin:0">存入登记</h1><div class="sp"></div>
    <button class="grey" onclick="screenLogout()">退出</button>
  </div>
  <div class="muted" id="storeUser" style="text-align:right;margin-bottom:8px"></div>
  <div class="card">
    <img id="live" alt="实时取景">
    <button id="captureBtn" class="big blue">拍照并识别</button>
    <button id="previewToggle" class="big grey" style="margin-top:8px">关闭实时预览</button>
    <div class="codes" id="codes"></div>
    <div class="guess" id="guess"></div>
  </div>
  <div class="card" id="formCard" style="display:none">
    <input id="name" placeholder="物品名称（点下方常用词，或键盘输入）" maxlength="30">
    <div class="cats" id="cats"></div>
    <div class="chips" id="chips"></div>
    <div class="volhint" id="volHint"></div>
    <input id="expire" type="date">
    <button id="saveBtn" class="big green" style="display:none">确认存入（打印标签并开锁）</button>
  </div>
  <div class="msg" id="storeMsg"></div>
</div>

<!-- 取出屏 -->
<div id="scr-take" class="hidden">
  <div class="topbar">
    <button class="grey" onclick="goHome()">← 返回</button>
    <div class="sp"></div><h1 style="margin:0">取出开锁</h1><div class="sp"></div>
    <div style="width:74px"></div>
  </div>
  <div class="card" id="myCard" style="display:none">
    <div class="guess" id="myTitle">我的物品（点击开锁取出）</div>
    <div id="myList"></div>
  </div>
  <div class="card">
    <input id="takeCode" placeholder="输入标签编码（8 位，如 A1B2C3D4）" maxlength="12">
    <button id="scanBtn" class="big grey">把物品放到摄像头前，扫标签取码</button>
    <button id="takeBtn" class="big green" style="margin-top:10px">开锁取出</button>
  </div>
  <div class="msg" id="takeMsg"></div>
</div>

<script>
const IDLE_MS = 90000;   // 无人操作 90 秒后回到待机屏并关闭摄像头
const VOL_ML = { "水果":200, "蔬菜":300, "奶制品":200, "肉禽":350, "水产":300,
                 "饮料":500, "零食熟食":150, "餐盒剩菜":800, "其他":300 };

let scr = "standby", state = { photo: "", qr: [], guessCategory: "", category: "" };
let liveOn = false, idleTimer = null;

/* ---------- 屏幕切换 ---------- */
function show(name) {
  scr = name;
  ["standby", "home", "login", "store", "take"].forEach(s =>
    document.getElementById("scr-" + s).classList.toggle("hidden", s !== name));
  if (name !== "login") stopLoginPoll();
  if (name !== "store" && liveOn) stopPreview();   // 离开存入屏即释放摄像头
  poke();
}
function goStandby() { session = null; show("standby"); }   // 公共屏幕：闲置即登出
function goHome() { show("home"); }

/* ---------- 待机计时：任何操作都续命，超时关摄像头回待机 ---------- */
function poke() {
  clearTimeout(idleTimer);
  if (scr !== "standby") idleTimer = setTimeout(goStandby, IDLE_MS);
}
["click", "touchstart", "keydown", "input"].forEach(ev =>
  document.addEventListener(ev, poke, { passive: true }));
document.getElementById("scr-standby").addEventListener("click", goHome);

/* ---------- 待机屏时钟 ---------- */
function tick() {
  const d = new Date(), p = n => String(n).padStart(2, "0");
  document.getElementById("clock").textContent = p(d.getHours()) + ":" + p(d.getMinutes());
  const wk = "日一二三四五六"[d.getDay()];
  document.getElementById("dateStr").textContent =
    `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} 星期${wk}`;
}
tick(); setInterval(tick, 1000);

/* ---------- 公共请求 ---------- */
function setMsg(id, t, ok) {
  const m = document.getElementById(id);
  m.textContent = t; m.style.color = ok ? "#22a06b" : "#d4380d";
}
async function post(url, body) {
  const r = await fetch(url, { method: "POST",
    headers: { "Content-Type": "application/json" },
    body: body ? JSON.stringify(body) : undefined });
  if (!r.ok) throw new Error((await r.json()).detail || r.status);
  return r.json();
}

/* ---------- 实时预览 ---------- */
const live = document.getElementById("live");
async function startPreview() {
  try {
    await post("/api/preview/start");
    live.src = "/api/preview/stream?t=" + Date.now();
    live.style.display = "block";
    liveOn = true;
    document.getElementById("previewToggle").textContent = "关闭实时预览";
    document.getElementById("previewToggle").style.display = "block";
  } catch (e) {
    liveOn = false;
    document.getElementById("previewToggle").style.display = "none";
  }
}
async function stopPreview() {
  try { await post("/api/preview/stop"); } catch (e) {}
  live.style.display = "none";
  live.src = "";
  liveOn = false;
  document.getElementById("previewToggle").textContent = "开启实时预览";
}
document.getElementById("previewToggle").onclick = () => {
  liveOn ? stopPreview() : startPreview();
};

/* ---------- 屏幕扫码登录（ticket 会话：出码 120s / 确认后 10 分钟） ---------- */
let session = null, loginTicket = "", loginPoll = null;

async function startLogin() {
  stopLoginPoll();
  setMsg("loginMsg", "正在获取登录码…", true);
  try {
    const d = await post("/api/login_start");
    loginTicket = d.ticket;
    document.getElementById("loginQr").src = d.qr_url;
    setMsg("loginMsg", "请在微信小程序「我的物品」页点「扫屏幕登录码」对准本屏", true);
    loginPoll = setInterval(pollLogin, 1000);
  } catch (e) { setMsg("loginMsg", "登录服务不可用：" + e.message, false); }
}
async function pollLogin() {
  if (scr !== "login" || !loginTicket) return;
  try {
    const r = await (await fetch("/api/login_status?ticket=" + loginTicket)).json();
    if (r.status === "confirmed") {
      stopLoginPoll();
      session = r.user;
      setMsg("loginMsg", `已登录：${session.name}，进入登记`, true);
      setTimeout(enterStore, 600);
    } else if (r.status === "expired") {
      startLogin();
    }
  } catch (e) {}
}
function stopLoginPoll() { if (loginPoll) { clearInterval(loginPoll); loginPoll = null; } }
function screenLogout() { session = null; loginTicket = ""; goHome(); }

/* ---------- 存入屏（需登录） ---------- */
function enterStore() {
  if (!session) { show("login"); startLogin(); return; }
  show("store");
  document.getElementById("storeUser").textContent =
    `登记人：${session.name} · ${session.room}`;
  const exp = document.getElementById("expire");
  if (!exp.value) exp.value = new Date(Date.now() + 3 * 86400000).toISOString().slice(0, 10);
  startPreview();   // 无真实摄像头时静默退回静拍模式
}

function volHint(cat) {
  const ml = VOL_ML[cat] || VOL_ML["其他"];
  document.getElementById("volHint").textContent =
    `估算体积：约 ${(ml/1000).toFixed(1)} L（按类别推断，宿管可在管理端修正）`;
}

/* 常用物品名快捷词：屏幕键盘不经过输入法只能敲英文，中文靠点选 */
const QUICK = {
  "水果": ["苹果", "香蕉", "橙子", "西瓜", "葡萄", "草莓", "芒果", "火龙果"],
  "蔬菜": ["西红柿", "黄瓜", "生菜", "西兰花", "胡萝卜", "玉米", "辣椒"],
  "奶制品": ["牛奶", "酸奶", "奶酪", "黄油", "奶油", "豆浆"],
  "肉禽": ["鸡胸肉", "猪肉", "牛肉", "香肠", "培根", "卤味"],
  "水产": ["鱼", "虾", "蟹", "鱿鱼", "贝类"],
  "饮料": ["可乐", "雪碧", "果汁", "茶饮", "矿泉水", "功能饮料"],
  "零食熟食": ["披萨", "汉堡", "三明治", "蛋糕", "饼干", "巧克力"],
  "餐盒剩菜": ["剩饭", "剩菜", "汤", "便当", "打包盒"],
  "其他": ["药品", "护肤品", "冰镇饮料", "速食", "调味酱"]
};
function renderChips(cat) {
  const chips = document.getElementById("chips");
  chips.innerHTML = "";
  (QUICK[cat] || QUICK["其他"]).forEach(w => {
    const b = document.createElement("button");
    b.textContent = w;
    b.onclick = () => {
      document.getElementById("name").value = w;
      state.category = cat;
      renderSel(document.getElementById("cats"), cat);
      volHint(cat);
    };
    chips.appendChild(b);
  });
}

function showResult(res) {
  state = { photo: res.photo, qr: res.qr_codes,
            guessCategory: res.guess.category, category: res.guess.category };
  document.getElementById("codes").textContent =
    res.qr_codes.length ? "识别到标签：" + res.qr_codes.join("，") : "未识别到标签二维码";
  document.getElementById("guess").innerHTML = res.guess.confidence > 0
    ? `系统建议分类：<b>${res.guess.category}</b>（置信度 ${(res.guess.confidence*100).toFixed(0)}%），请确认或修正`
    : "系统暂无分类建议，请手动选择分类";
  const cats = document.getElementById("cats");
  cats.innerHTML = "";
  res.categories.forEach(c => {
    const b = document.createElement("button");
    b.textContent = c;
    b.onclick = () => { state.category = c; renderSel(cats, c); volHint(c); renderChips(c); };
    cats.appendChild(b);
  });
  renderSel(cats, state.category);
  volHint(state.category);
  renderChips(state.category);
  document.getElementById("formCard").style.display = "block";
  document.getElementById("saveBtn").style.display = "block";
  document.getElementById("name").focus();
}

function renderSel(cats, cur) {
  [...cats.children].forEach(b => b.classList.toggle("sel", b.textContent === cur));
}

async function grabRecognitionResult() {
  // 优先从实时视频抓当前帧；无预览时退回相机静拍
  if (liveOn && live.naturalWidth > 0) {
    const canvas = document.createElement("canvas");
    canvas.width = live.naturalWidth; canvas.height = live.naturalHeight;
    canvas.getContext("2d").drawImage(live, 0, 0);
    const blob = await new Promise(ok => canvas.toBlob(ok, "image/jpeg", 0.92));
    const fd = new FormData();
    fd.append("file", blob, "frame.jpg");
    const r = await fetch("/api/capture_frame", { method: "POST", body: fd });
    if (!r.ok) throw new Error((await r.json()).detail || r.status);
    return await r.json();
  }
  return await post("/api/capture");
}

document.getElementById("captureBtn").onclick = async () => {
  setMsg("storeMsg", "正在拍照识别…", true);
  try {
    showResult(await grabRecognitionResult());
    setMsg("storeMsg", "", true);
  } catch (e) { setMsg("storeMsg", "识别失败：" + e.message, false); }
};

let saveBusy = { v: false };
document.getElementById("saveBtn").onclick = async () => {
  if (saveBusy.v) return;
  if (!session) { show("login"); startLogin(); return; }
  const name = document.getElementById("name").value.trim();
  const expire = document.getElementById("expire").value;
  if (!name) return setMsg("storeMsg", "请填写物品名称", false);
  if (!expire) return setMsg("storeMsg", "请选择到期日期", false);
  saveBusy.v = true;
  setMsg("storeMsg", "登记中：生成编码、打印标签、申请开锁…", true);
  const sentAt = Date.now() / 1000;
  try {
    const d = await post("/api/register_item", { name, category: state.category,
      expire_at: expire, quantity: 1, login_ticket: loginTicket });
    document.getElementById("name").value = "";
    await waitUnlock(d.code, "storeMsg",
      `标签 ${d.code} 已打印 · 已开锁，请放入物品并贴好标签（约 60 秒后自动上锁）`, sentAt);
    session = null; loginTicket = "";   // 登记完成立即登出，防止下一人冒用身份
    setTimeout(goHome, 8000);
  } catch (e) { setMsg("storeMsg", "登记失败：" + e.message, false); }
  saveBusy.v = false;
};

/* ---------- 开锁等待（登记/取出共用） ---------- */
async function waitUnlock(code, msgId, doneMsg, sentAt) {
  let done = false;
  for (let i = 0; i < 40 && scr !== "standby"; i++) {   // Pi 轮询后端约 2 秒一次
    await new Promise(r => setTimeout(r, 500));
    try {
      const lu = await (await fetch("/api/last_unlock")).json();
      if (lu.code === code && lu.at >= sentAt) { done = true; break; }
    } catch (e) {}
  }
  setMsg(msgId, done ? doneMsg : "开锁超时，请重试或联系宿管", done);
  return done;
}

async function unlockByCode(code, msgId, doneMsg, busyGuard) {
  setMsg(msgId, "正在校验并通知冰箱开锁…", true);
  const sentAt = Date.now() / 1000;
  try {
    await post("/api/unlock_code", { code });
  } catch (e) {
    setMsg(msgId, "开锁失败：" + e.message, false);
    busyGuard.v = false; return;
  }
  await waitUnlock(code, msgId, doneMsg, sentAt);
  busyGuard.v = false;
}

/* ---------- 取出屏 ---------- */
let takeBusy = { v: false };
function enterTake() {
  show("take");
  document.getElementById("takeCode").focus();
  renderMyItems();
}

async function renderMyItems() {
  const card = document.getElementById("myCard"), list = document.getElementById("myList");
  card.style.display = "none"; list.innerHTML = "";
  if (!session || !loginTicket) return;
  try {
    const r = await (await fetch("/api/my_items?ticket=" + loginTicket)).json();
    if (!r.items || !r.items.length) return;
    document.getElementById("myTitle").textContent = `${session.name} 的物品（点击开锁取出）`;
    r.items.forEach(it => {
      const b = document.createElement("button");
      b.className = "big grey"; b.style.marginTop = "8px";
      b.textContent = `${it.name} · 到期 ${it.expire_at} · ${it.code}`;
      b.onclick = () => {
        if (takeBusy.v) return;
        takeBusy.v = true;
        unlockByCode(it.code, "takeMsg", "已开锁，请取出物品并关门（约 60 秒后自动上锁）", takeBusy);
      };
      list.appendChild(b);
    });
    card.style.display = "block";
  } catch (e) {}
}

document.getElementById("scanBtn").onclick = async () => {
  setMsg("takeMsg", "请将标签对准摄像头，正在识别…", true);
  try {
    let res;
    if (liveOn && live.naturalWidth > 0) {
      res = await grabRecognitionResult();
    } else {
      res = await post("/api/capture");   // 取出屏默认不开预览，摄像头空闲可静拍
    }
    if (res.qr_codes.length) {
      document.getElementById("takeCode").value = res.qr_codes[0];
      setMsg("takeMsg", "已读取标签：" + res.qr_codes.join("，"), true);
    } else {
      setMsg("takeMsg", "未识别到二维码，请手动输入编码", false);
    }
  } catch (e) { setMsg("takeMsg", "扫码失败：" + e.message, false); }
};

document.getElementById("takeBtn").onclick = () => {
  if (takeBusy.v) return;
  const code = document.getElementById("takeCode").value.trim();
  if (!code) return setMsg("takeMsg", "请输入或扫描标签编码", false);
  takeBusy.v = true;
  unlockByCode(code, "takeMsg", "已开锁，请取出物品并关门（约 60 秒后自动上锁）", takeBusy);
};

/* ---------- 页面离开时释放摄像头，避免占用 ---------- */
window.addEventListener("pagehide", () => {
  if (liveOn) fetch("/api/preview/stop", { method: "POST", keepalive: true });
});

/* 初始进入待机屏（不占用摄像头） */
goStandby();
</script>
</body>
</html>
